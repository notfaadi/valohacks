name = "valohack"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Workers Builds / dashboard `npx wrangler deploy`
[assets]
directory = "./dist"
binding = "ASSETS"
# Host redirects (www / HTTP) must run before static files are served.
run_worker_first = true

# Cloudflare CI leaves Build command empty and only runs `npx wrangler deploy`.
[build]
command = "npm run build"
