name = "valohacks"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[build]
command = "npm run build"

[[routes]]
pattern = "valohacks.net"
custom_domain = true

[[routes]]
pattern = "www.valohacks.net"
custom_domain = true

[[routes]]
pattern = "valohacks.net/*"
zone_name = "valohacks.net"

[[routes]]
pattern = "www.valohacks.net/*"
zone_name = "valohacks.net"
